<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Välj betalningssätt för Lunar UF:s örngott.">
  <title>Kassa — Lunar UF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --white: #f7f7f7; --muted: #a5a5a5; --line: rgba(255,255,255,.14); }
    * { box-sizing: border-box; }
    html { scroll-behavior: auto; }
    body {
      min-height: 100vh; margin: 0; background: #000; color: var(--white);
      font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased;
      transition: opacity .42s ease, transform .42s ease;
    }
    body.page-leaving { opacity: 0; transform: translateY(6px); }
    a { color: inherit; }
    .shell { width: min(1060px, calc(100% - 48px)); margin-inline: auto; }
    header {
      height: 84px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; font: 700 16px Manrope, sans-serif; }
    .moon {
      width: 34px; height: 34px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.25); border-radius: 50%; font-size: 20px;
    }
    .back { color: #c9c9c9; text-decoration: none; font-size: 13px; transition: color .35s ease; }
    .back:hover { color: #fff; }
    main { width: min(660px, 100%); margin: 58px auto 90px; }
    .steps { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; color: #858585; font-size: 11px; }
    .steps .current { color: #fff; }
    .steps .line { width: 28px; height: 1px; background: #444; }
    .eyebrow { color: #bbb; font-size: 10px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 12px 0 10px; font: 600 clamp(34px, 6vw, 48px)/1.1 Manrope, sans-serif; letter-spacing: -.055em; }
    .lead { margin: 0 0 28px; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .order-card {
      display: flex; align-items: center; gap: 16px; padding: 16px 18px; margin-bottom: 26px;
      border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.035);
    }
    .product-icon {
      width: 54px; height: 54px; flex: 0 0 54px; display: grid; place-items: center;
      border-radius: 12px; background: #151515; color: #fff; font-size: 25px;
    }
    .order-name { font-weight: 600; font-size: 14px; }
    .order-detail { margin-top: 4px; color: #979797; font-size: 11px; }
    .order-price { margin-left: auto; color: #c6c6c6; font-size: 12px; text-align: right; }
    h2 { margin: 0 0 13px; font: 600 17px Manrope, sans-serif; }
    .methods { display: grid; gap: 10px; }
    .method {
      width: 100%; min-height: 72px; display: flex; align-items: center; gap: 14px;
      padding: 13px 16px; border: 1px solid rgba(255,255,255,.15); border-radius: 15px;
      background: #090909; color: #fff; text-align: left; cursor: pointer;
      transition: transform .42s cubic-bezier(.2,.75,.25,1), border-color .42s ease, background .42s ease, box-shadow .42s ease;
    }
    .method:hover, .method:focus-visible {
      transform: translateY(-2px); border-color: rgba(255,255,255,.55);
      background: #111; box-shadow: 0 10px 28px rgba(255,255,255,.055); outline: none;
    }
    .method:active { transform: scale(.99); }
    .method-icon {
      width: 40px; height: 40px; flex: 0 0 40px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.15); border-radius: 11px; font: 700 15px Manrope, sans-serif;
    }
    .swish .method-icon { background: #5134bd; border-color: #735de0; }
    .card .method-icon { font-size: 21px; }
    .paypal .method-icon { color: #9fc5ff; font-style: italic; }
    .method-copy { flex: 1; }
    .method-name { display: block; font-weight: 600; font-size: 13px; }
    .method-desc { display: block; margin-top: 4px; color: #969696; font-size: 11px; }
    .arrow { color: #bdbdbd; font-size: 18px; transition: transform .42s ease; }
    .method:hover .arrow { transform: translateX(4px); }
    .status {
      min-height: 42px; margin: 14px 0 0; padding: 12px 14px;
      border: 1px solid transparent; border-radius: 12px;
      color: #a9a9a9; font-size: 12px; line-height: 1.65;
    }
    .status.is-visible { border-color: rgba(255,255,255,.13); background: rgba(255,255,255,.045); color: #e3e3e3; }
    .safe-note { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); color: #888; font-size: 11px; line-height: 1.7; }
    .secure { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 8px; color: #c9c9c9; }
    .secure-mark { color: #fff; }
    @media (max-width: 560px) {
      .shell { width: calc(100% - 32px); }
      header { height: 72px; }
      main { margin-top: 38px; }
      .steps { gap: 8px; }
      .order-card { padding: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
